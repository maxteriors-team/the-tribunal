name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly: Mondays at 06:00 UTC
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          # Alembic revision scripts are generated boilerplate whose required
          # module globals (revision, down_revision, branch_labels, depends_on)
          # are read by Alembic via introspection, never imported. The quality
          # suite reports all four as unused on *every* migration — 4 guaranteed
          # false positives per file. `main` requires review conversations to be
          # resolved before merge, so each one must be dismissed by hand before a
          # release can land, which trains people to click through CodeQL rather
          # than read it.
          #
          # Migrations keep their own safety net: migrations.yml runs a real
          # up -> check -> down -> up against Postgres, catching what actually
          # goes wrong here (irreversibility, drift) and which static analysis
          # cannot see anyway.
          config: |
            paths-ignore:
              - backend/alembic/versions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
