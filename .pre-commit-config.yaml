# Pre-commit hooks for The Tribunal.
# Install: pre-commit install
# Run on all files: pre-commit run --all-files
# Update hook versions: pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        # ``backend/openapi.json`` is a generated snapshot of the FastAPI
        # schema (~1 MB) committed as the source of truth for the CI
        # freshness gate (see .github/workflows/backend-ci.yml). It must be
        # tracked so ``git diff --exit-code`` can detect drift.
        # ``frontend/src/lib/api/_generated.ts`` is the openapi-typescript
        # output for that same schema — also generated, also tracked so the
        # diff is reviewable. Same exemption applies.
        exclude: ^(backend/openapi\.json|frontend/src/lib/api/_generated\.ts)$

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: no-build-stamp
        name: block committing the deploy build stamp
        entry: bash -c 'echo "✗ backend/app/build_info.json is a deploy-time artifact written by scripts/ops/deploy_backend.sh and deleted after upload. Committing it makes GET /version report a stale SHA — worse than \"unknown\". Run: git rm --cached backend/app/build_info.json"; exit 1'
        language: system
        files: ^backend/app/build_info\.json$
        pass_filenames: false
      - id: frontend-eslint
        name: frontend eslint (staged ts/tsx)
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
      - id: frontend-typecheck
        name: frontend typecheck (staged ts/tsx)
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
