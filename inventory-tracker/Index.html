<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #17211b;
      --muted: #59645e;
      --canvas: #f2f0e9;
      --surface: #fffef9;
      --line: #c9cdc6;
      --strong-line: #909991;
      --accent: #245f3e;
      --accent-hover: #194b30;
      --danger: #a12f2f;
      --focus: #0c67c7;
      --radius: 8px;
      --rail: 1180px;
    }
    * { box-sizing: border-box; }
    html { background: var(--canvas); }
    body { margin: 0; color: var(--ink); font-family: "DM Sans", sans-serif; line-height: 1.45; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .58; }
    :focus { outline: none; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .skip-link { position: fixed; inset-block-start: 8px; inset-inline-start: 8px; z-index: 10; transform: translateY(-160%); padding: 10px 14px; background: var(--ink); color: white; }
    .skip-link:focus { transform: translateY(0); }
    .rail { width: min(calc(100% - 40px), var(--rail)); margin-inline: auto; }
    header { border-block-end: 1px solid var(--line); background: var(--surface); }
    .header-inner { min-height: 74px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: -.02em; }
    .mark { width: 30px; height: 30px; display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; gap: 3px; padding: 5px; border: 2px solid var(--ink); }
    .mark i { display: block; background: var(--accent); }
    .mark i:nth-child(1) { height: 45%; } .mark i:nth-child(2) { height: 100%; } .mark i:nth-child(3) { height: 70%; }
    .sync { color: var(--muted); font-size: .875rem; }
    main { padding-block: 42px 72px; }
    .intro { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: end; margin-block-end: 28px; }
    h1 { max-width: 720px; margin: 0 0 8px; font-size: clamp(2rem, 4vw, 3.4rem); line-height: 1.02; letter-spacing: -.045em; }
    .lede { margin: 0; color: var(--muted); font-size: 1.05rem; }
    .summary { min-width: 180px; padding-inline-start: 24px; border-inline-start: 3px solid var(--accent); }
    .summary strong { display: block; font-family: "DM Mono", monospace; font-size: 1.7rem; }
    .summary span { color: var(--muted); font-size: .875rem; }
    form { background: var(--surface); border: 1px solid var(--strong-line); border-radius: var(--radius); overflow: hidden; }
    .details { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 20px; padding: 22px; border-block-end: 1px solid var(--line); }
    label { display: grid; gap: 7px; font-size: .875rem; font-weight: 600; }
    input { min-height: 44px; width: 100%; border: 1px solid var(--strong-line); border-radius: 5px; padding: 9px 11px; background: white; color: var(--ink); }
    input:hover { border-color: var(--ink); }
    input[aria-invalid="true"] { border-color: var(--danger); border-width: 2px; }
    .search-wrap { position: relative; }
    .search-wrap input { padding-inline-start: 40px; }
    .search-icon { position: absolute; inset-inline-start: 12px; inset-block-start: 50%; transform: translateY(-50%); width: 18px; height: 18px; pointer-events: none; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px 22px; text-align: start; border-block-end: 1px solid var(--line); }
    th { color: var(--muted); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; background: #f7f6f0; }
    td:nth-child(1) { width: 22%; font-family: "DM Mono", monospace; font-size: .875rem; }
    td:nth-child(3) { width: 14%; }
    td:nth-child(4) { width: 120px; }
    td:nth-child(5) { width: 150px; }
    .quantity { max-width: 110px; font-family: "DM Mono", monospace; text-align: end; }
    .empty { padding: 48px 22px; text-align: center; color: var(--muted); }
    .form-actions { min-height: 78px; display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 16px 22px; background: #f7f6f0; }
    .status { margin: 0; font-size: .9rem; }
    .status[data-kind="error"] { color: var(--danger); font-weight: 600; }
    .status[data-kind="success"] { color: var(--accent); font-weight: 700; }
    .primary { min-height: 46px; border: 0; border-radius: 5px; padding: 11px 20px; background: var(--accent); color: white; font-weight: 700; transition: background-color 150ms ease; }
    .primary:hover:not(:disabled) { background: var(--accent-hover); }
    .skeleton { height: 18px; border-radius: 3px; background: linear-gradient(90deg, #e3e2dc 25%, #f2f1eb 50%, #e3e2dc 75%); background-size: 200% 100%; animation: load 1.2s linear infinite; }
    @keyframes load { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } * { scroll-behavior: auto !important; } }
    @media (max-width: 720px) {
      .rail { width: min(calc(100% - 24px), var(--rail)); }
      .header-inner { min-height: 62px; }
      .sync { display: none; }
      main { padding-block: 28px 48px; }
      .intro { grid-template-columns: 1fr; gap: 18px; }
      .summary { padding-inline-start: 14px; }
      .details { grid-template-columns: 1fr; gap: 14px; padding: 16px; }
      th, td { padding: 12px 16px; }
      .form-actions { align-items: stretch; flex-direction: column; padding: 16px; }
      .primary { width: 100%; }
    }
    @media (forced-colors: active) { .mark i, .primary { forced-color-adjust: none; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#inventory">Skip to inventory</a>
  <header>
    <div class="rail header-inner">
      <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span> Warehouse Inventory</div>
      <span class="sync" id="sync-status">Connecting to Google Sheets</span>
    </div>
  </header>
  <main class="rail" id="inventory">
    <section class="intro" aria-labelledby="page-title">
      <div><h1 id="page-title">Count what is on the shelf.</h1><p class="lede">Enter current quantities, then save one timestamped warehouse count.</p></div>
      <div class="summary"><strong id="counted-total">0 / 0</strong><span>products counted</span></div>
    </section>
    <form id="inventory-form" novalidate>
      <div class="details">
        <label>Warehouse location<input id="location" name="location" autocomplete="organization" required maxlength="100"></label>
        <label>Counted by<input id="counted-by" name="countedBy" autocomplete="name" required maxlength="100"></label>
        <label>Find a product<span class="search-wrap"><svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="search" type="search" placeholder="Search SKU or product name" autocomplete="off"></span></label>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col">SKU</th><th scope="col">Product</th><th scope="col">Price</th><th scope="col">Current</th><th scope="col">New count</th></tr></thead>
          <tbody id="product-rows"><tr><td colspan="5"><div class="skeleton" aria-label="Loading products"></div></td></tr></tbody>
        </table>
      </div>
      <div class="form-actions">
        <p class="status" id="form-status" role="status" aria-live="polite">Enter a quantity for each product counted.</p>
        <button class="primary" id="save-button" type="submit" disabled>Save inventory count</button>
      </div>
    </form>
  </main>
  <script>
    const state = { products: [], stockLevels: {}, submitting: false };
    const rows = document.querySelector('#product-rows');
    const form = document.querySelector('#inventory-form');
    const search = document.querySelector('#search');
    const saveButton = document.querySelector('#save-button');
    const formStatus = document.querySelector('#form-status');

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
    }

    function renderProducts() {
      const query = search.value.trim().toLowerCase();
      const visible = state.products.filter((product) => `${product.sku} ${product.name}`.toLowerCase().includes(query));
      rows.innerHTML = visible.length ? visible.map((product) => `
        <tr>
          <td>${escapeHtml(product.sku)}</td>
          <td>${escapeHtml(product.name)}</td>
          <td>${escapeHtml(product.price)}</td>
          <td>${Object.hasOwn(state.stockLevels, product.sku) ? escapeHtml(state.stockLevels[product.sku]) : 'Not counted'}</td>
          <td><label><span class="sr-only">New quantity for ${escapeHtml(product.name)}</span><input class="quantity" type="number" inputmode="numeric" min="0" max="999999" step="1" data-sku="${escapeHtml(product.sku)}" aria-label="New quantity for ${escapeHtml(product.name)}"></label></td>
        </tr>`).join('') : `<tr><td colspan="5" class="empty">${state.products.length ? 'No products match your search.' : 'No products were found in the Products sheet.'}</td></tr>`;
      updateCount();
    }

    function updateCount() {
      const count = [...document.querySelectorAll('.quantity')].filter((input) => input.value !== '').length;
      document.querySelector('#counted-total').textContent = `${count} / ${state.products.length}`;
      saveButton.disabled = state.submitting || !state.products.length;
    }

    function showError(error) {
      rows.innerHTML = '<tr><td colspan="5" class="empty">Products could not be loaded. Check the Products sheet and reload this page.</td></tr>';
      document.querySelector('#sync-status').textContent = 'Sheet connection failed';
      formStatus.textContent = error && error.message ? error.message : 'Could not load inventory.';
      formStatus.dataset.kind = 'error';
    }

    google.script.run.withSuccessHandler((result) => {
      state.products = result.products;
      document.querySelector('#sync-status').textContent = `Sheet synced ${new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' }).format(new Date(result.lastUpdated))}`;
      renderProducts();
    }).withFailureHandler(showError).getCatalog();

    search.addEventListener('input', renderProducts);
    rows.addEventListener('input', updateCount);
    document.querySelector('#location').addEventListener('change', (event) => {
      const location = event.target.value.trim();
      if (!location) {
        state.stockLevels = {};
        renderProducts();
        return;
      }
      formStatus.textContent = `Loading current stock for ${location}.`;
      google.script.run.withSuccessHandler((levels) => {
        state.stockLevels = levels;
        renderProducts();
        formStatus.textContent = `Current stock loaded for ${location}.`;
        delete formStatus.dataset.kind;
      }).withFailureHandler((error) => {
        formStatus.textContent = error && error.message ? error.message : 'Current stock could not be loaded.';
        formStatus.dataset.kind = 'error';
      }).getStockLevels(location);
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const requiredFields = [document.querySelector('#location'), document.querySelector('#counted-by')];
      const invalid = requiredFields.find((field) => !field.value.trim());
      requiredFields.forEach((field) => field.removeAttribute('aria-invalid'));
      if (invalid) {
        invalid.setAttribute('aria-invalid', 'true');
        formStatus.textContent = `${invalid.labels[0].textContent.trim()} is required.`;
        formStatus.dataset.kind = 'error';
        invalid.focus();
        return;
      }

      const items = [...document.querySelectorAll('.quantity')]
        .filter((input) => input.value !== '')
        .map((input) => ({ sku: input.dataset.sku, quantity: Number(input.value) }));
      if (!items.length) {
        formStatus.textContent = 'Enter at least one product quantity.';
        formStatus.dataset.kind = 'error';
        document.querySelector('.quantity')?.focus();
        return;
      }

      state.submitting = true;
      updateCount();
      saveButton.textContent = 'Saving count…';
      formStatus.textContent = 'Saving inventory to Google Sheets.';
      delete formStatus.dataset.kind;

      google.script.run.withSuccessHandler((result) => {
        state.submitting = false;
        document.querySelectorAll('.quantity').forEach((input) => { input.value = ''; });
        saveButton.textContent = 'Save inventory count';
        items.forEach((item) => { state.stockLevels[item.sku] = item.quantity; });
        renderProducts();
        formStatus.textContent = `${result.saved} product ${result.saved === 1 ? 'count' : 'counts'} saved.`;
        formStatus.dataset.kind = 'success';
        updateCount();
      }).withFailureHandler((error) => {
        state.submitting = false;
        saveButton.textContent = 'Try saving again';
        formStatus.textContent = error && error.message ? error.message : 'Inventory could not be saved. Try again.';
        formStatus.dataset.kind = 'error';
        updateCount();
      }).saveInventory({ location: requiredFields[0].value, countedBy: requiredFields[1].value, items });
    });
  </script>
</body>
</html>
